[versions]
agp = "8.11.2"
circleimageview = "3.1.0"
core = "3.5.3"
firebaseBom = "33.6.0"
glide = "4.16.0"
google-services = "4.4.2"
gson = "2.11.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
firebaseAuth = "24.0.1"
